name: CI

on: [push, pull_request]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux
            allow_build_failure: false
            vcpkg_cache_path: ~/.cache/vcpkg/archives
          - os: windows-latest
            preset: windows
            allow_build_failure: false
            vcpkg_cache_path: ~\AppData\Local\vcpkg\archives
          - os: macos-latest
            preset: macos
            # Was `true` (milestone 0002 defect #5: compiler-ID branch never
            # matched AppleClang; milestone 0005 status.md: __APPLE__ excluded
            # from the physical-memory #if guards). Both fixed by milestone
            # 0001's Story 02.1 (fix-macos-build) - see that story's status.md
            # for the real, from-scratch build/link/run/sanitizer proof.
            allow_build_failure: false
            vcpkg_cache_path: ~/.cache/vcpkg/archives
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Cache vcpkg binary cache (built package archives)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.vcpkg_cache_path }}
          key: vcpkg-binarycache-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure (${{ matrix.preset }} preset)
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        continue-on-error: ${{ matrix.allow_build_failure }}

      - name: Run functional test (best-effort - needs elevated privileges to read the real SMBIOS table)
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          BIN=$(find . -type f \( -name 'smbios_functional_test' -o -name 'smbios_functional_test.exe' \) | head -n1)
          if [ -z "$BIN" ]; then
            echo "::warning::smbios_functional_test binary not found - build may not have produced it"
            exit 0
          fi
          chmod +x "$BIN" 2>/dev/null || true
          "$BIN" --log_level=message || echo "::warning::smbios_functional_test failed or needs elevated privileges to read this runner's real SMBIOS table - making this a reliable, unprivileged CI signal is milestone 0006's job (hermetic, fixture-based tests), not this one's. See docs/roadmap/0006-testing-hardening-and-documentation/plan.md."
        continue-on-error: true
