name: CI

on: [push, pull_request]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux
            allow_build_failure: false
            vcpkg_cache_path: ~/.cache/vcpkg/archives
          - os: windows-latest
            preset: windows
            allow_build_failure: false
            vcpkg_cache_path: ~\AppData\Local\vcpkg\archives
          - os: macos-latest
            preset: macos
            # Was `true` (milestone 0002 defect #5: compiler-ID branch never
            # matched AppleClang; milestone 0005 status.md: __APPLE__ excluded
            # from the physical-memory #if guards). Both fixed by milestone
            # 0001's Story 02.1 (fix-macos-build) - see that story's status.md
            # for the real, from-scratch build/link/run/sanitizer proof.
            allow_build_failure: false
            vcpkg_cache_path: ~/.cache/vcpkg/archives
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Cache vcpkg binary cache (built package archives)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.vcpkg_cache_path }}
          key: vcpkg-binarycache-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure (${{ matrix.preset }} preset)
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        id: build
        run: cmake --build --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        continue-on-error: ${{ matrix.allow_build_failure }}

      - name: Run functional test (best-effort - needs elevated privileges to read the real SMBIOS table)
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          BIN=$(find . -type f \( -name 'smbios_functional_test' -o -name 'smbios_functional_test.exe' \) | head -n1)
          if [ -z "$BIN" ]; then
            echo "::warning::smbios_functional_test binary not found - build may not have produced it"
            exit 0
          fi
          chmod +x "$BIN" 2>/dev/null || true
          "$BIN" --log_level=message || echo "::warning::smbios_functional_test failed or needs elevated privileges to read this runner's real SMBIOS table - making this a reliable, unprivileged CI signal is milestone 0006's job (hermetic, fixture-based tests), not this one's. See docs/roadmap/0006-testing-hardening-and-documentation/plan.md."
        continue-on-error: true

      # Milestone 0005, Story 04.0: Windows has no sanitizers job (unlike
      # ubuntu/macos below - MSVC sanitizer flags are a different setup
      # entirely, out of this story's scope), so without this step nothing
      # in CI ever ran smbios_unit_test/smbios_mock_test on Windows at all.
      # This is the only automated confirmation that WindowsNativeSource
      # (adapted from the pre-existing SMBiosImpl, see
      # smbios/src/source_windows/windows_native_source.cpp) builds and its
      # own unit coverage passes on a real Windows runner.
      - name: Run unprivileged tests (smbios_unit_test, smbios_mock_test)
        if: matrix.os == 'windows-latest' && steps.build.outcome == 'success'
        # -C Debug: the windows preset uses the Visual Studio generator
        # (multi-config), unlike linux/macos's single-config Ninja - ctest
        # needs an explicit configuration or every test shows "Not Run"
        # ("Test not available without configuration"). cmake --build
        # --preset windows with no --config defaults to Debug (confirmed
        # from the Build step's own .vcxproj output paths).
        run: ctest --test-dir build/${{ matrix.preset }} -C Debug --output-on-failure -R "smbios_unit_test|smbios_mock_test"

      # Milestone 0005, Story 04.0, Task 02: unlike Linux/macOS's legacy
      # scan, Windows's native source (GetSystemFirmwareTable(), via
      # WindowsNativeSource) needs no elevated privilege - so a passing
      # run here is real evidence the native source succeeded, not just
      # "it compiled". Kept best-effort (not a hard gate) only because a
      # virtualized CI runner's firmware could plausibly not expose a
      # usable SMBIOS table at all - a CI-environment limitation, not a
      # privilege one, unlike every other best-effort step in this file.
      - name: Run integration test (best-effort - a virtualized CI runner's firmware may not expose a real SMBIOS table)
        if: matrix.os == 'windows-latest' && steps.build.outcome == 'success'
        # smbios_perf_test is bundled in here too: it has no hard timing
        # threshold (just BOOST_TEST_MESSAGE-logs enumeration time), so it
        # carries the same "real SMBios construction" risk/reward as
        # smbios_integration_test with no flakiness risk of its own.
        run: ctest --test-dir build/${{ matrix.preset }} -C Debug --output-on-failure -R "smbios_integration_test|smbios_perf_test" || echo "::warning::smbios_integration_test/smbios_perf_test failed on Windows - WindowsNativeSource needs no privilege, so this likely means the CI runner's (possibly virtualized) firmware doesn't expose a usable SMBIOS table, not a privilege issue. See docs/roadmap/0005-uefi-and-native-source-abstraction/status.md's Story 04.0 entry."
        continue-on-error: true

  sanitizers:
    name: sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux
            vcpkg_cache_path: ~/.cache/vcpkg/archives
          - os: macos-latest
            preset: macos
            vcpkg_cache_path: ~/.cache/vcpkg/archives
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Cache vcpkg binary cache (built package archives)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.vcpkg_cache_path }}
          key: vcpkg-binarycache-${{ matrix.os }}-sanitizers-${{ hashFiles('vcpkg.json') }}

      # ASan/UBSan need their own configure (same preset, extra sanitizer
      # compile/link flags) rather than reusing the `build` job's cache -
      # a separate preset binaryDir keeps this from clobbering the plain
      # build job's tree if both run against the same checkout.
      - name: Configure (${{ matrix.preset }} preset, -fsanitize=address,undefined)
        run: >
          cmake --preset ${{ matrix.preset }}
          -B build/${{ matrix.preset }}-asan
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        id: build
        run: cmake --build build/${{ matrix.preset }}-asan
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      # Mirrors the `build` job's existing root-gated handling: the
      # deterministic, no-hardware/no-root subset (unit + mock) must pass
      # outright, while the real-SMBIOS-reading subset (integration/perf)
      # is run best-effort and allowed to fail without elevated privileges,
      # same as that job's "functional test" step.
      - name: Run unprivileged tests (smbios_unit_test, smbios_mock_test)
        if: steps.build.outcome == 'success'
        working-directory: build/${{ matrix.preset }}-asan
        shell: bash
        env:
          # detect_container_overflow=0: libc++'s vector<string> container
          # annotations produce a false-positive container-overflow on the
          # ordinary push_back-triggered reallocation in
          # AbstractSMBiosEntry::parse_dmi_strings() (verified locally on
          # AppleClang/libc++ - not a real out-of-bounds access); this is a
          # known libc++/ASan interaction, not an application bug.
          # detect_leaks=0 (macOS only): AddressSanitizer on macOS does not
          # support LeakSanitizer (known platform limitation from milestone
          # 0001).
          ASAN_OPTIONS: ${{ matrix.os == 'macos-latest' && 'detect_leaks=0:detect_container_overflow=0' || 'detect_container_overflow=0' }}
        run: ctest --output-on-failure -R 'smbios_unit_test|smbios_mock_test'

      - name: Run privileged tests best-effort (smbios_integration_test, smbios_perf_test)
        if: steps.build.outcome == 'success'
        working-directory: build/${{ matrix.preset }}-asan
        shell: bash
        env:
          ASAN_OPTIONS: ${{ matrix.os == 'macos-latest' && 'detect_leaks=0:detect_container_overflow=0' || 'detect_container_overflow=0' }}
        run: ctest --output-on-failure -R 'smbios_integration_test|smbios_perf_test' || echo "::warning::sanitizer run of smbios_integration_test/smbios_perf_test failed or needs elevated privileges to read this runner's real SMBIOS table - same known limitation as the build job's functional-test step; making this reliable without root is milestone 0006's job."
        continue-on-error: true
