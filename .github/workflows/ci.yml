# Entry workflow of the rebuilt CI (milestone 0014, Story 03.0 Task 01;
# ADR 0005 D8). It holds the triggers and the job order only; every job
# calls a reusable stage workflow, whose every `run:` step is one
# `python3 scripts/ci/stage.py <stage> ...` line (plan SC1, policy P7).
# Runs side by side with the old ci.yml until the Story 03.0 Task 04
# cutover renames this file to ci.yml.
#
# Triggers: the old ci.yml's push + pull_request, minus probe/** branches
# (Story 04.0 Task 03), plus v* tags (a release is this pipeline on a tag,
# ADR 0005 D7; the legacy -DGIT_TAG tags never match, P12) and a nightly
# schedule (plan Q1). No workflow_dispatch (maintainer ruling, Q1 as
# applied here). Tiering (Q1): a push to a branch other than master runs
# lint + the Linux build, sanitizer and gui legs; pull requests, master pushes,
# v* tags and the nightly run the full matrix. The leg lists live in the
# stage workflows' matrices and in scripts/ci/legs.json "tiers" (kept equal
# by scripts/ci/tests/test_stage.py).
#
# Environment: the neutral CI_* mapping (ADR 0005) is in each stage
# workflow, because a caller's `env:` does not reach a called workflow.
name: CI

on:
  push:
    branches-ignore: ['probe/**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/stage-lint.yml

  build:
    needs: lint
    uses: ./.github/workflows/stage-build.yml

  # Story 03.0 Task 02: inventory C12-C14 (ASan + fatal UBSan, Linux/macOS).
  sanitizers:
    needs: lint
    uses: ./.github/workflows/stage-sanitizers.yml

  # Story 03.0 Task 03: inventory C15-C20 (GUI build; the merge-blocking
  # R-7 hook-string and R-8 local-tier-absent guards).
  gui:
    needs: lint
    uses: ./.github/workflows/stage-gui.yml
