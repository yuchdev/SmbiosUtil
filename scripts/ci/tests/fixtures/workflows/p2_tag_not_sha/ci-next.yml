# Policy-gate fixture: violates exactly P2 (uses: pinned to a tag).
name: fixture
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Lint
        run: python3 scripts/ci/lint.py
        timeout-minutes: 5
