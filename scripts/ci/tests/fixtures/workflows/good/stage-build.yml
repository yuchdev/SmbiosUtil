# Compliant build-stage fixture (policy gate P1-P15). Not a real workflow.
name: stage-build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            leg: linux-x64
          - os: macos-15
            leg: macos-arm64
          - os: windows-2022
            leg: windows-x64
    env:
      CI_LEG: ${{ matrix.leg }}
      CI_JOB: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Restore vcpkg cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.leg }}-${{ hashFiles('vcpkg.json') }}
      - name: Build
        id: build
        run: python3 scripts/ci/stage.py build
        timeout-minutes: 15
        env:
          VCPKG_BINARY_SOURCES: clear
      - name: Save vcpkg cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.leg }}-${{ hashFiles('vcpkg.json') }}
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: logs-${{ matrix.leg }}
          path: |
            ${{ runner.temp }}/ci-logs/configure.log
            ${{ runner.temp }}/ci-logs/build.log
          include-hidden-files: false
          retention-days: 3
