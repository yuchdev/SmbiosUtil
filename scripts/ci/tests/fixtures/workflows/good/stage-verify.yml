# Compliant verify-stage fixture (policy gate P1-P15). Not a real workflow.
name: stage-verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Verify
        run: python3 scripts/ci/stage.py verify
        timeout-minutes: 5
